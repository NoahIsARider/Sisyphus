<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SISYPHUS — a terminal detective story</title>
<link rel="stylesheet" href="xterm/xterm.css">
<style>
  :root {
    --bg: #0a0e0a;
    --fg: #c8d6c2;
    --dim: #6b7a66;
    --accent: #9db88f;
    --cursor: #d8e8d0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #banner {
    flex: 0 0 auto;
    padding: 10px 16px 8px;
    border-bottom: 1px solid #1c241a;
    user-select: none;
  }
  #banner .title {
    letter-spacing: 0.35em;
    font-weight: 700;
    color: var(--accent);
    font-size: 13px;
  }
  #banner .sub {
    color: var(--dim);
    font-size: 11px;
    margin-top: 2px;
    letter-spacing: 0.08em;
  }
  #terminal-wrap {
    flex: 1 1 auto;
    min-height: 0;
    padding: 8px 10px 10px;
  }
  #terminal {
    width: 100%;
    height: 100%;
  }
  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--dim);
    font-size: 14px;
    letter-spacing: 0.2em;
    z-index: 10;
    transition: opacity 0.4s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .dot { animation: blink 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 60% { opacity: 1; } 80%, 100% { opacity: 0; } }
</style>
</head>
<body>
<div id="loading"><span>BOOTING SISYPHUS<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></span></div>
<div id="banner">
  <div class="title">SISYPHUS</div>
  <div class="sub">a terminal detective story &nbsp;·&nbsp; type HELP to begin</div>
</div>
<div id="terminal-wrap"><div id="terminal"></div></div>

<script src="xterm/xterm.js"></script>
<script src="xterm/xterm-addon-fit.js"></script>
<script src="pyodide/pyodide.js"></script>
<script src="main.js"></script>
</body>
</html>
